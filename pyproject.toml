[project]
name = "Mindful-Core"
version = "0.1.4"
description = "Python code core for the deep learning projects leveraging multimodal fusion at the HedS"
authors = [
    { name = "Valentin Durand de Gevigney" },
    { name = "Jérôme Schmid" },
    { name = "Belinda Mataj-Lokaj" },
]
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy==1.26.3",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "monai==1.5.0",
    "matplotlib==3.6.2",
    "opencv-python==4.6.0.66",
    "pytorch-lightning-bolts>=0.3.2,<0.4",
    "umap-learn>=0.5.9,<0.6",
    "wandb>=0.13.5,<0.14",
    "gym>=0.26.2,<0.27",
    "pandas>=1.5.1,<2",
    "itk>=5.4.0,<5.5",
    "nibabel>=4.0.2,<5",
    "simpleitk>=2.3.1,<2.4",
    "einops>=0.8.0,<0.9",
    "pydicom>=2.3.1,<3",
    "deid>=0.3.21,<0.4",
    "s3fs>=2023.1.0,<2024",
    "mlflow>=3.0.0,<4",
    "statsmodels>=0.14.1,<0.15",
    "seaborn>=0.13.2,<0.14",
    "pydicom-seg>=0.4.1,<0.5",
    "openpyxl>=3.1.2,<4",
    "lightning==2.5.5",
    "torchmetrics==1.8.2",
    "lightning-utilities==0.15.2",
    "tensorboard>=2.17.1,<3",
    "fire>=0.6.0,<0.7",
    "grpcio>=1.66.1,<2",
    "termcolor>=2.4.0,<3",
    "weasyprint>=65.1,<66",
    "jinja2>=3.1.6,<4",
    "pypdf>=6.0.0,<7",
    "scikit-learn (==1.7.2)",
    "scipy (==1.16.2)",
    "tqdm (==4.67.1)",
    "pillow (==11.3.0)",
    "pytorch-lightning (==2.5.5)",
]

[project.urls]
Repository = "https://github.com/heds-trm/mindful_core"

[project.scripts]
mindful-core = "mindful_core.__main__:main"

[tool.poetry]
packages = [{ include = "mindful_core", from = "src" }]

# PyPI may reject direct URLs to dependencies, so URLs to the CUDA wheels were removed.
# -> Installing with pip gives PyPI's default torch build (CPU-only on Windows).
#   For GPU support, first install torch from https://download.pytorch.org/whl/cu121.
#   The source below only applies to `poetry install` in this repository.
[[tool.poetry.source]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.dependencies]
torch = { source = "pytorch-cu121" }
torchaudio = { source = "pytorch-cu121" }
torchvision = { source = "pytorch-cu121" }

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.0.0"
pep8 = "^1.7.1"
pylint = "^2.15.6"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

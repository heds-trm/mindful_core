[tool.poetry]
name = "Mindful-Core"
version = "0.1.4"
description = "Python code core for the deep learning projects leveraging multimodal fusion at the HedS"
authors = ["Valentin Durand de Gevigney", "Jérôme Schmid", "Belinda Mataj-Lokaj"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "~3.11"
numpy = "1.26.3"
torch = [
    { url = "https://download.pytorch.org/whl/cu121/torch-2.5.1%2Bcu121-cp311-cp311-win_amd64.whl", platform = "win32" },
    { url = "https://download.pytorch.org/whl/cu121/torch-2.5.1%2Bcu121-cp311-cp311-linux_x86_64.whl", platform = "linux" }
]
torchaudio = [
    { url = "https://download.pytorch.org/whl/cu121/torchaudio-2.5.1%2Bcu121-cp311-cp311-win_amd64.whl", platform = "win32" },
    { url = "https://download.pytorch.org/whl/cu121/torchaudio-2.5.1%2Bcu121-cp311-cp311-linux_x86_64.whl", platform = "linux" }
]
torchvision = [
    { url = "https://download.pytorch.org/whl/cu121/torchvision-0.20.1%2Bcu121-cp311-cp311-win_amd64.whl", platform = "win32" },
    { url = "https://download.pytorch.org/whl/cu121/torchvision-0.20.1%2Bcu121-cp311-cp311-linux_x86_64.whl", platform = "linux" }
]
monai = "1.5.0"
matplotlib = "3.6.2"
opencv-python = "4.6.0.66"
pytorch-lightning-bolts = "^0.3.2"
umap-learn = "^0.5.9"
wandb = "^0.13.5"
gym = "^0.26.2"
pandas = "^1.5.1"
itk = "~5.4.0"
nibabel = "^4.0.2"
simpleitk = "~2.3.1"
einops = "^0.8.0"
pep8 = "^1.7.1"
pylint = "^2.15.6"
pydicom = "^2.3.1"
deid = "^0.3.21"
s3fs = "^2023.1.0"
mlflow = "^3.0.0"
statsmodels = "^0.14.1"
seaborn = "^0.13.2"
pydicom-seg = "^0.4.1"
openpyxl = "^3.1.2"
lightning = "2.5.5"
torchmetrics = "1.8.2"
lightning-utilities = "0.15.2"
tensorboard = "^2.17.1"
fire = "^0.6.0"
grpcio = "^1.66.1"
termcolor = "^2.4.0"
weasyprint = "^65.1"
jinja2 = "^3.1.6"
pypdf = "^6.0.0"

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
